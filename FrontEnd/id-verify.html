<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f59e0b" />
  <title>实名信息 - FurryEvent</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="logo-area">
    <span class="logo-icon">📇</span>
    <h1 class="logo-title">实名信息</h1>
    <p class="logo-sub">请填写真实身份信息</p>
  </div>

  <div class="card">
    <form id="idForm" autocomplete="off">
      <div class="form-group">
        <label for="realName">真实姓名 <span style="color:var(--error)">*</span></label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="realName" placeholder="请输入真实姓名" maxlength="20" required />
        </div>
      </div>

      <div class="form-group">
        <label for="idCard">身份证号 <span style="color:var(--error)">*</span><span class="input-counter" id="idCardCounter" style="float:right;font-weight:normal;color:#a8a29e;font-size:12px">0/18</span></label>
        <div class="input-wrapper">
          <span class="input-icon">🆔</span>
          <input type="text" id="idCard" placeholder="请输入18位身份证号" maxlength="18" required />
        </div>
      </div>

      <div class="form-group">
        <label for="phone">手机号<span class="input-counter" id="phoneCounter" style="float:right;font-weight:normal;color:#a8a29e;font-size:12px">0/11</span></label>
        <div class="input-wrapper">
          <span class="input-icon">📱</span>
          <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11" />
        </div>
      </div>

      <p id="statusMsg" style="text-align:center;font-size:13px;min-height:20px;margin:8px 0"></p>

      <button type="submit" class="btn btn-primary" id="submitBtn">提交实名信息</button>
      <button type="button" class="btn" onclick="location.href='home.html'" style="margin-top:10px;background:#e7e5e4;color:#44403c;width:100%;">返回</button>
    </form>
  </div>

  <p style="font-size:12px;color:#a8a29e;margin-bottom:20px;">信息加密存储，仅用于核验</p>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

    if (!App.requireAuth()) {}

    var token = localStorage.getItem('token');

    // 加载已有实名信息
    async function loadProfile() {
      try {
        var r = await fetch(location.origin + '/api/auth/me', {
          headers: { Authorization: 'Bearer ' + token }
        });
        var d = await r.json();
        if (d.code === 200 && d.data) {
          if (d.data.verified) {
            // 已实名：显示打码信息，禁用表单
            document.getElementById('realName').value = d.data.real_name;
            document.getElementById('idCard').value = d.data.id_card_masked || '';
            document.getElementById('phone').value = d.data.phone_masked || '';
            document.getElementById('realName').disabled = true;
            document.getElementById('idCard').disabled = true;
            document.getElementById('phone').disabled = true;
            document.getElementById('statusMsg').innerHTML = '<span style="color:var(--success)">✓ 已实名认证（不可修改）</span>';
            document.getElementById('submitBtn').style.display = 'none';
          } else {
            // 未实名：正常填充
            if (d.data.real_name) document.getElementById('realName').value = d.data.real_name;
            if (d.data.id_card) document.getElementById('idCard').value = d.data.id_card;
            if (d.data.phone) document.getElementById('phone').value = d.data.phone;
          }
        }
      } catch(e) {}
    }

    document.getElementById('idForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var realName = document.getElementById('realName').value.trim();
      var idCard = document.getElementById('idCard').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('statusMsg');

      if (!realName) { msg.innerHTML = '<span style="color:var(--error)">请输入真实姓名</span>'; return; }
      if (!idCard) { msg.innerHTML = '<span style="color:var(--error)">请输入身份证号</span>'; return; }
      if (idCard.length !== 18) { msg.innerHTML = '<span style="color:var(--error)">身份证号应为18位</span>'; return; }
      if (phone && !/^1[3-9]\d{9}$/.test(phone)) { msg.innerHTML = '<span style="color:var(--error)">手机号格式不正确</span>'; return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span>提交中...';
      msg.innerHTML = '';

      try {
        var r = await fetch(location.origin + '/api/auth/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ real_name: realName, id_card: idCard, phone: phone || undefined })
        });
        var d = await r.json();
        if (d.code === 200) {
          msg.innerHTML = '<span style="color:var(--success)">✓ ' + esc(d.message) + '，3秒后返回首页...</span>';
          btn.textContent = '更新实名信息';
          var user = App.getUser();
          if (user) { user.real_name = realName; user.id_card = idCard; user.phone = phone; localStorage.setItem('user', JSON.stringify(user)); }
          setTimeout(function() { location.href = 'home.html'; }, 3000);
        } else {
          msg.innerHTML = '<span style="color:var(--error)">' + esc(d.message || '提交失败') + '</span>';
        }
      } catch(ex) {
        msg.innerHTML = '<span style="color:var(--error)">网络错误</span>';
      } finally {
        btn.disabled = false;
        if (btn.innerHTML.indexOf('更新') === -1) btn.textContent = '提交实名信息';
      }
    });

    // 字数计数器
    document.getElementById('idCard').addEventListener('input', function() {
      document.getElementById('idCardCounter').textContent = this.value.length + '/18';
    });
    document.getElementById('phone').addEventListener('input', function() {
      document.getElementById('phoneCounter').textContent = this.value.length + '/11';
    });

    loadProfile();
  </script>
</body>
</html>
