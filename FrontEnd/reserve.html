<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f59e0b" />
  <title>购买门票 - FurryEvent</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js" integrity="sha384-HGmnkDZJy7mRkoARekrrj0VjEFSh9a0Z8qxGri/kTTAJkgR8hqD1lHsYSh3JdzRi" crossorigin="anonymous"></script>
</head>
<body>

  <div class="logo-area">
    <span class="logo-icon">🎫</span>
    <h1 class="logo-title">购买门票</h1>
    <p class="logo-sub">选择票档，轻松购买</p>
  </div>

  <div class="card">
    <!-- 票档选择（自定义下拉） -->
    <div class="form-group">
      <label>门票票档 <span style="color:var(--error)">*</span></label>
      <div id="roomDropdown" class="custom-select">
        <div class="custom-select__trigger" id="roomTrigger">
          <span id="roomLabel">请选择票档</span>
          <span class="custom-select__arrow">▼</span>
        </div>
        <ul class="custom-select__options" id="roomOptions">
          <li class="loading-hint" style="justify-content:center;color:#a8a29e;cursor:default;">加载中…</li>
        </ul>
      </div>
      <input type="hidden" id="roomType" value="" />
    </div>




    <style>
      .custom-select { position: relative; width: 100%; font-family: var(--font); }
      .custom-select__trigger {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px; border: 1.5px solid var(--border); border-radius: 12px;
        background: #fafaf9; cursor: pointer; font-size: 15px; color: var(--text);
      }
      .custom-select__trigger:hover { border-color: var(--primary); }
      .custom-select__arrow { font-size: 11px; color: #a8a29e; transition: transform .2s; }
      .custom-select.open .custom-select__arrow { transform: rotate(180deg); }
      .custom-select__options {
        display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
        background: #fff; border: 1.5px solid var(--border); border-radius: 12px;
        list-style: none; margin: 0; padding: 6px 0; z-index: 90;
        box-shadow: 0 4px 16px rgba(0,0,0,.08); max-height: 200px; overflow-y: auto;
      }
      .custom-select.open .custom-select__options { display: block; }
      .custom-select__options li {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 14px; cursor: pointer; font-size: 15px; color: var(--text);
      }
      .custom-select__options li:hover { background: #fef3c7; }
      .custom-select__options li .opt-name { text-align: left; }
      .custom-select__options li .opt-remain { font-size: 12px; color: #a8a29e; white-space: nowrap; }
    </style>


    <!-- 实名信息提示 -->
    <div class="form-group" id="identityInfo" style="background:#fef3c7;padding:12px;border-radius:12px;font-size:14px;color:#78716c;">
      <span>⏳ 正在获取实名信息…</span>
    </div>

    <!-- 购票数量 -->
    <div class="form-group">
      <label for="guests">购票张数</label>
      <input type="number" id="guests" min="1" max="4" value="1" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;background:#fafaf9;color:var(--text);font-family:var(--font);" />
    </div>

    <!-- 备注 -->
    <div class="form-group">
      <label for="remark">备注</label>
      <div class="input-wrapper">
        <span class="input-icon">📝</span>
        <input type="text" id="remark" placeholder="如有特殊需求请备注" maxlength="100" />
      </div>
    </div>

    <div id="priceSummary" style="font-size:16px;font-weight:700;color:var(--text);margin:16px 0;text-align:right;display:none;">
      订单总价：<span id="totalPriceVal" style="color:var(--primary-dark);font-size:22px;">¥0</span>
    </div>

    <p id="statusMsg" style="text-align:center;font-size:13px;min-height:20px;margin:8px 0"></p>

    <button type="button" class="btn btn-primary" id="submitBtn">立即购买门票</button>
    <button type="button" class="btn" onclick="location.href='home.html'" style="margin-top:10px;background:#e7e5e4;color:#44403c;width:100%;">返回首页</button>
  </div>



  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

    if (!App.requireAuth()) {}

    // ===== 检查预定开关与购票上限 =====
    var bookingClosed = false;
    (function checkBookingStatus() {
      fetch('/api/settings/booking-status')
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (res.code === 200 && res.data) {
            if (!res.data.open) {
              bookingClosed = true;
              var card = document.querySelector('.card');
              card.innerHTML = ''
                + '<div style="text-align:center;padding:40px 20px;">'
                +   '<div style="font-size:48px;margin-bottom:16px;">🔒</div>'
                +   '<h2 style="color:var(--text);margin:0 0 12px;">购票暂未开放</h2>'
                +   '<p style="font-size:14px;color:var(--text-secondary);margin:0 0 24px;">请等待管理员开放购票通道</p>'
                +   '<a href="home.html" class="btn" style="display:inline-block;text-decoration:none;background:#e7e5e4;color:#44403c;padding:12px 32px;">返回首页</a>'
                + '</div>';
            } else {
              var maxTickets = res.data.max_tickets_per_user || 1;
              var guestsInput = document.getElementById('guests');
              if (guestsInput) {
                guestsInput.setAttribute('max', maxTickets);
                var label = guestsInput.previousElementSibling;
                if (label) {
                  label.innerHTML = '购票张数 <small style="color:var(--text-secondary);font-weight:normal;">(限购 ' + maxTickets + ' 张)</small>';
                }
                updatePriceSummary();
              }
            }
          }
        })
        .catch(function() {});
    })();

    // ===== 从后端加载房型 =====
    // ===== 全局变量管理选中的状态 =====
    var selectedPackage = null; // 当前选中的套餐对象
    var allPackages = [];       // 所有加载的套餐大类

    // ===== 从后端加载房型 (套餐大类) =====
    function loadRoomTypes() {
      var optionsEl = document.getElementById('roomOptions');
      fetch('/api/room-types')
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (res.code !== 200 || !res.data || !res.data.length) {
            optionsEl.innerHTML = '<li style="justify-content:center;color:var(--error);cursor:default;">暂无票档</li>';
            return;
          }
          allPackages = res.data;
          optionsEl.innerHTML = res.data.map(function(t) {
            return '<li data-value="' + t.name + '">'
              + '<span class="opt-name">' + t.label + '</span>'
              + '<span class="opt-remain">剩余 ' + t.available + '</span>'
              + '</li>';
          }).join('');
        })
        .catch(function() {
          optionsEl.innerHTML = '<li style="justify-content:center;color:var(--error);cursor:default;">加载失败</li>';
        });
    }
    loadRoomTypes();

    // ===== 实时订单价格与限额联动更新 =====
    function updatePriceSummary() {
      var guestsInput = document.getElementById('guests');
      var maxT = parseInt(guestsInput.getAttribute('max')) || 1;
      var guests = parseInt(guestsInput.value) || 1;
      if (guests > maxT) {
         guests = maxT;
         guestsInput.value = maxT;
      }
      if (guests < 1) {
         guests = 1;
         guestsInput.value = 1;
      }

      var priceSummary = document.getElementById('priceSummary');
      var totalPriceVal = document.getElementById('totalPriceVal');

      if (selectedPackage) {
        var total = selectedPackage.basePrice * guests;
        totalPriceVal.textContent = '¥' + total;
        priceSummary.style.display = 'block';
      } else {
        priceSummary.style.display = 'none';
      }
    }

    // 绑定购买张数输入框的输入事件，实时计算总价
    document.getElementById('guests').addEventListener('input', updatePriceSummary);
    document.getElementById('guests').addEventListener('change', updatePriceSummary);

    // ===== 自定义下拉框逻辑 (套餐大类) =====
    (function() {
      var dropdown = document.getElementById('roomDropdown');
      var trigger = document.getElementById('roomTrigger');
      var label = document.getElementById('roomLabel');
      var options = document.getElementById('roomOptions');
      var hidden = document.getElementById('roomType');

      trigger.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });

      options.addEventListener('click', function(e) {
        var li = e.target.closest('li');
        if (!li) return;
        var val = li.getAttribute('data-value');
        var name = li.querySelector('.opt-name').textContent;
        hidden.value = val;
        label.textContent = name;
        dropdown.classList.remove('open');

        // 记录选中套餐
        selectedPackage = allPackages.find(function(p) { return p.name === val; });
        updatePriceSummary();
      });

      document.addEventListener('click', function() {
        dropdown.classList.remove('open');
      });
      dropdown.addEventListener('click', function(e) { e.stopPropagation(); });
    })();



    // ===== 获取实名信息 =====
    var userIdentity = { real_name: '', phone: '' };
    (function loadIdentity() {
      var el = document.getElementById('identityInfo');
      fetch('/api/auth/me', {
        headers: { 'Authorization': 'Bearer ' + App.getToken() }
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.code === 200 && res.data) {
          var u = res.data;
          if (u.real_name) {
            userIdentity.real_name = u.real_name;
            userIdentity.phone = u.phone || '';
            el.innerHTML = '<span>✅ 持票人：' + esc(u.real_name) + (u.phone ? '　电话：' + esc(u.phone) : '') + '</span>';
          } else {
            el.innerHTML = '<span style="color:var(--error)">⚠️ 您尚未完成实名认证，<a href="id-verify.html" style="color:var(--primary)">去认证</a></span>';
            document.getElementById('submitBtn').disabled = true;
          }
        } else {
          el.innerHTML = '<span style="color:var(--error)">获取用户信息失败</span>';
        }
      })
      .catch(function() {
        el.innerHTML = '<span style="color:var(--error)">网络错误</span>';
      });
    })();

    // ===== 提交预定 =====
    document.getElementById('submitBtn').addEventListener('click', function() {
      var roomType = document.getElementById('roomType').value;
      var guests = document.getElementById('guests').value;
      var remark = document.getElementById('remark').value.trim();
      var msg = document.getElementById('statusMsg');
      var btn = document.getElementById('submitBtn');

      // 前端校验
      if (bookingClosed) { msg.innerHTML = '<span style="color:var(--error)">购票通道暂未开放</span>'; return; }

      if (!roomType) { msg.innerHTML = '<span style="color:var(--error)">请选择门票票档</span>'; return; }

      if (!userIdentity.real_name) { msg.innerHTML = '<span style="color:var(--error)">请先完成实名认证</span>'; return; }

      btn.disabled = true;
      btn.textContent = '提交中…';
      msg.innerHTML = '';

      var orderData = {
        room_type: roomType,
        guests: parseInt(guests) || 1,
        guest_name: userIdentity.real_name,
        guest_phone: userIdentity.phone,
        remark: remark
      };

      fetch('/api/user/orders', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + App.getToken()
        },
        body: JSON.stringify(orderData)
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        btn.disabled = false;
        btn.textContent = '立即购买门票';
        if (res.code === 200) {
          var orderId = res.data.order_id;
          var card = document.querySelector('.card');
          card.innerHTML = ''
            + '<div style="text-align:center;padding:20px 0;">'
            +   '<div style="font-size:48px;margin-bottom:12px;">✅</div>'
            +   '<h2 style="color:var(--text);margin:0 0 8px;">购票申请已提交</h2>'
            +   '<p style="font-size:14px;color:var(--text-secondary);margin:0 0 16px;">请等待管理员确认付款并出票</p>'
            +   '<div style="background:#fef3c7;border-radius:12px;padding:16px;margin-bottom:16px;">'
            +     '<p style="font-size:15px;font-weight:700;color:var(--text);margin:0;">订单号：#' + orderId + '</p>'
            +     '<p style="font-size:13px;color:var(--text-secondary);margin:8px 0 0;">当前状态：待确认</p>'
            +   '</div>'
            +   '<a href="orders.html" class="btn btn-primary" style="display:inline-block;text-decoration:none;width:auto;padding:12px 32px;">查看我的门票</a>'
            +   '<br/><a href="home.html" style="display:inline-block;margin-top:12px;font-size:14px;color:var(--primary-dark);text-decoration:none;">返回首页</a>'
            + '</div>';
        } else {
          msg.innerHTML = '<span style="color:var(--error)">' + esc(res.message || '提交失败') + '</span>';
        }
      })
      .catch(function() {
        btn.disabled = false;
        btn.textContent = '立即购买门票';
        msg.innerHTML = '<span style="color:var(--error)">网络错误，请稍后重试</span>';
      });
    });
  </script>
</body>
</html>
