<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>FurryEvent - 注册</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Logo -->
  <div class="logo-area">
    <span class="logo-icon">🐾</span>
    <h1 class="logo-title">FurryEvent</h1>
    <p class="logo-sub">大型狂欢沙龙活动，欢迎购票参加</p>
  </div>

  <!-- 注册卡片 -->
  <div class="card">
    <h2>创建账号 ✨</h2>
    <p class="subtitle">加入 FurryEvent，开启您的狂欢旅程</p>

    <form id="registerForm" autocomplete="off">
      <!-- 用户名 -->
      <div class="form-group">
        <label for="username">用户名 <span style="color:var(--error)">*</span></label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="username"
            placeholder="3-20位字母、数字或下划线"
            autocomplete="off"
            maxlength="20"
            required
          />
        </div>
      </div>

      <!-- 昵称 -->
      <div class="form-group">
        <label for="nickname">昵称</label>
        <div class="input-wrapper">
          <span class="input-icon">🐶</span>
          <input
            type="text"
            id="nickname"
            placeholder="给自己取个好听的名字"
            autocomplete="off"
            maxlength="20"
          />
        </div>
      </div>

      <!-- 手机号 -->
      <div class="form-group">
        <label for="phone">手机号</label>
        <div class="input-wrapper">
          <span class="input-icon">📱</span>
          <input
            type="tel"
            id="phone"
            placeholder="选填，方便后续联系"
            autocomplete="off"
            maxlength="11"
          />
        </div>
      </div>

      <!-- 邀请码（邀请码模式时显示） -->
      <div class="form-group" id="inviteCodeGroup" style="display:none">
        <label for="inviteCode">邀请码 <span style="color:var(--error)">*</span></label>
        <div class="input-wrapper">
          <span class="input-icon">🎟️</span>
          <input
            type="text"
            id="inviteCode"
            placeholder="请输入邀请码"
            autocomplete="off"
            maxlength="32"
          />
        </div>
      </div>

      <!-- 密码 -->
      <div class="form-group">
        <label for="password">密码 <span style="color:var(--error)">*</span></label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            placeholder="6-30位密码"
            autocomplete="new-password"
            maxlength="30"
            required
          />
          <span class="toggle-pwd" id="togglePwd" title="显示密码">👁️</span>
        </div>
      </div>

      <!-- 确认密码 -->
      <div class="form-group">
        <label for="confirmPassword">确认密码 <span style="color:var(--error)">*</span></label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="confirmPassword"
            placeholder="请再次输入密码"
            autocomplete="new-password"
            maxlength="30"
            required
          />
        </div>
      </div>

      <!-- 注册按钮 -->
      <button type="submit" class="btn btn-primary" id="registerBtn">注 册</button>
    </form>

    <!-- 跳转登录 -->
    <div class="form-footer">
      已有账号？<a href="index.html">立即登录 →</a>
    </div>
  </div>

  <!-- 底部 -->
  <p style="font-size:12px;color:#a8a29e;margin-bottom:20px;">&copy; 2026 FurryEvent</p>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // ---- 已登录则跳转 ----
    App.checkLoggedIn();

    // ---- 检查注册模式 ----
    var _regMode = 'open';
    (async function() {
      try {
        var resp = await fetch(location.origin + '/api/settings/registration-mode');
        var data = await resp.json();
        if (data.code === 200 && data.data) {
          _regMode = data.data.mode;
          if (_regMode === 'closed') {
            document.getElementById('registerForm').innerHTML = '<p style="text-align:center;color:#666;padding:40px 0;font-size:15px">🚫 当前注册已关闭，请联系管理员</p>';
            document.querySelector('.form-footer').style.display = 'none';
            return;
          }
          if (_regMode === 'invite') {
            document.getElementById('inviteCodeGroup').style.display = '';
          }
          if (_regMode === 'review') {
            document.getElementById('registerBtn').textContent = '提交注册申请';
          }
        }
      } catch(e) {}
    })();

    // ---- 密码显隐切换 ----
    const pwdInput = document.getElementById('password');
    const togglePwd = document.getElementById('togglePwd');
    togglePwd.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      togglePwd.textContent = isPassword ? '🙈' : '👁️';
    });

    // ---- 表单提交 ----
    const form = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const nickname = document.getElementById('nickname').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const inviteCode = document.getElementById('inviteCode') ? document.getElementById('inviteCode').value.trim() : '';

      // ---- 前端校验 ----
      if (!username || !password || !confirmPassword) {
        App.toast('请填写必填项', 'error');
        return;
      }

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        App.toast('用户名需为3-20位字母、数字或下划线', 'error');
        return;
      }

      if (password.length < 6 || password.length > 30) {
        App.toast('密码长度需为6-30位', 'error');
        return;
      }

      if (password !== confirmPassword) {
        App.toast('两次输入的密码不一致', 'error');
        return;
      }

      if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
        App.toast('手机号格式不正确', 'error');
        return;
      }

      // 邀请码模式下必须填写邀请码
      if (_regMode === 'invite' && !inviteCode) {
        App.toast('请输入邀请码', 'error');
        return;
      }

      App.setBtnLoading(registerBtn, true);

      try {
        var payload = {
          username: username,
          password: password,
          nickname: nickname || undefined,
          phone: phone || undefined,
        };
        if (inviteCode) payload.invite_code = inviteCode;

        const res = await api.register(payload);

        if (res.code === 201 && res.data && res.data.token) {
          // 开放/邀请码模式：直接登录
          App.saveLogin(res.data.token, res.data.user);
          App.toast('注册成功！欢迎加入 🎉', 'success');
          setTimeout(() => {
            window.location.href = 'home.html';
          }, 800);
        } else if (res.code === 201) {
          // 审核模式：无 token 返回
          App.toast(res.message || '注册成功，请等待管理员审核', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2000);
        } else {
          App.toast(res.message || '注册失败', 'error');
        }
      } catch (err) {
        App.toast('网络错误，请检查后端服务是否启动', 'error');
        console.error(err);
      } finally {
        App.setBtnLoading(registerBtn, false);
      }
    });
  </script>
</body>
</html>
