<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>FurryHotel - 注册</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Logo -->
  <div class="logo-area">
    <span class="logo-icon">🐾</span>
    <h1 class="logo-title">FurryHotel</h1>
    <p class="logo-sub">xxx小聚，欢迎参加</p>
  </div>

  <!-- 注册卡片 -->
  <div class="card">
    <h2>创建账号 ✨</h2>
    <p class="subtitle">加入 FurryHotel，开始萌宠之旅</p>

    <form id="registerForm" autocomplete="off">
      <!-- 用户名 -->
      <div class="form-group">
        <label for="username">用户名 <span style="color:var(--error)">*</span></label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="username"
            placeholder="3-20位字母、数字或下划线"
            autocomplete="off"
            maxlength="20"
            required
          />
        </div>
      </div>

      <!-- 昵称 -->
      <div class="form-group">
        <label for="nickname">昵称</label>
        <div class="input-wrapper">
          <span class="input-icon">🐶</span>
          <input
            type="text"
            id="nickname"
            placeholder="给自己取个好听的名字"
            autocomplete="off"
            maxlength="20"
          />
        </div>
      </div>

      <!-- 手机号 -->
      <div class="form-group">
        <label for="phone">手机号</label>
        <div class="input-wrapper">
          <span class="input-icon">📱</span>
          <input
            type="tel"
            id="phone"
            placeholder="选填，方便后续联系"
            autocomplete="off"
            maxlength="11"
          />
        </div>
      </div>

      <!-- 密码 -->
      <div class="form-group">
        <label for="password">密码 <span style="color:var(--error)">*</span></label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            placeholder="6-30位密码"
            autocomplete="new-password"
            maxlength="30"
            required
          />
          <span class="toggle-pwd" id="togglePwd" title="显示密码">👁️</span>
        </div>
      </div>

      <!-- 确认密码 -->
      <div class="form-group">
        <label for="confirmPassword">确认密码 <span style="color:var(--error)">*</span></label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="confirmPassword"
            placeholder="请再次输入密码"
            autocomplete="new-password"
            maxlength="30"
            required
          />
        </div>
      </div>

      <!-- 注册按钮 -->
      <button type="submit" class="btn btn-primary" id="registerBtn">注 册</button>
    </form>

    <!-- 跳转登录 -->
    <div class="form-footer">
      已有账号？<a href="index.html">立即登录 →</a>
    </div>
  </div>

  <!-- 底部 -->
  <p style="font-size:12px;color:#a8a29e;margin-bottom:20px;">&copy; 2024 FurryHotel</p>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // ---- 已登录则跳转 ----
    App.checkLoggedIn();

    // ---- 密码显隐切换 ----
    const pwdInput = document.getElementById('password');
    const togglePwd = document.getElementById('togglePwd');
    togglePwd.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      togglePwd.textContent = isPassword ? '🙈' : '👁️';
    });

    // ---- 表单提交 ----
    const form = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const nickname = document.getElementById('nickname').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // ---- 前端校验 ----
      if (!username || !password || !confirmPassword) {
        App.toast('请填写必填项', 'error');
        return;
      }

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        App.toast('用户名需为3-20位字母、数字或下划线', 'error');
        return;
      }

      if (password.length < 6 || password.length > 30) {
        App.toast('密码长度需为6-30位', 'error');
        return;
      }

      if (password !== confirmPassword) {
        App.toast('两次输入的密码不一致', 'error');
        return;
      }

      if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
        App.toast('手机号格式不正确', 'error');
        return;
      }

      App.setBtnLoading(registerBtn, true);

      try {
        const res = await api.register({
          username,
          password,
          nickname: nickname || undefined,
          phone: phone || undefined,
        });

        if (res.code === 201) {
          App.saveLogin(res.data.token, res.data.user);
          App.toast('注册成功！欢迎加入 🎉', 'success');
          setTimeout(() => {
            window.location.href = 'home.html';
          }, 800);
        } else {
          App.toast(res.message || '注册失败', 'error');
        }
      } catch (err) {
        App.toast('网络错误，请检查后端服务是否启动', 'error');
        console.error(err);
      } finally {
        App.setBtnLoading(registerBtn, false);
      }
    });
  </script>
</body>
</html>
