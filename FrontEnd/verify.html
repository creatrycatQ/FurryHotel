<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f59e0b" />
  <title>FurryHotel - 在线核验</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js" integrity="sha384-HGmnkDZJy7mRkoARekrrj0VjEFSh9a0Z8qxGri/kTTAJkgR8hqD1lHsYSh3JdzRi" crossorigin="anonymous"></script>
  <style>
    .order-list { width: 100%; max-width: 400px; padding-bottom: 40px; }
    .order-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .order-header .order-id {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .order-status {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-confirmed { background: #d1fae5; color: #065f46; }
    .status-checked_in { background: #dbeafe; color: #1e40af; }
    .status-completed { background: #e0e7ff; color: #3730a3; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }
    .order-info { font-size: 13px; color: var(--text-secondary); line-height: 1.8; }
    .order-info span { color: var(--text); font-weight: 500; }
    .qr-area {
      margin-top: 16px;
      text-align: center;
      padding: 16px;
      background: #fefce8;
      border-radius: 12px;
    }
    .qr-area canvas { display: block; margin: 0 auto 8px; }
    .qr-hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="logo-area" style="padding-top:24px;">
    <span class="logo-icon">✅</span>
    <h1 class="logo-title">在线核验</h1>
    <p class="logo-sub">出示二维码，前台扫码即可入住</p>
  </div>

  <div class="order-list">
    <a class="back-link" href="home.html">← 返回首页</a>
    <div id="orderContainer">
      <div class="empty-state">
        <div class="icon">⏳</div>
        <p>加载中...</p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

    if (!App.requireAuth()) { /* redirect */ }

    async function loadOrders() {
      const container = document.getElementById('orderContainer');
      try {
        const res = await api.getUserOrders();
        if (res.code !== 200) {
          container.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${esc(res.message || '加载失败')}</p></div>`;
          return;
        }

        const orders = res.data;
        if (!orders || orders.length === 0) {
          container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>暂无订单</p></div>`;
          return;
        }

        container.innerHTML = '';
        for (const order of orders) {
          const card = document.createElement('div');
          card.className = 'order-card';

          const statusClass = `status-${order.status}`;
          const statusText = App.getStatusText(order.status);

          card.innerHTML = `
            <div class="order-header">
              <span class="order-id">订单 #${order.id}</span>
              <span class="order-status ${statusClass}">${esc(statusText)}</span>
            </div>
            <div class="order-info">
              👤 入住人：<span>${esc(order.guest_name)}</span><br/>
              🏨 房间：<span>${esc(order.room_number || '待分配')} ${esc(order.room_type_label || order.room_type || '')}</span>
            </div>
            ${(order.status === 'pending' || order.status === 'confirmed') ? '<div class="qr-area"><canvas id="qr-' + order.id + '"></canvas><div class="qr-hint">请让前台扫描此二维码完成入住</div></div>' : ''}
            ${order.status === 'checked_in' ? '<div class="qr-area" style="background:#d1fae5;"><div class="qr-hint" style="color:#065f46;font-weight:600;">✅ 已完成核验入住</div></div>' : ''}
          `;
          container.appendChild(card);

          // Generate QR code for active orders
          if (order.status === 'pending' || order.status === 'confirmed') {
            const qrData = JSON.stringify({ type: 'furry_checkin', order_id: order.id });
            QRCode.toCanvas(document.getElementById(`qr-${order.id}`), qrData, {
              width: 180,
              margin: 2,
              color: { dark: '#292524', light: '#fefce8' },
            });
          }
        }
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><div class="icon">❌</div><p>网络错误，请重试</p></div>`;
        console.error(err);
      }
    }

    loadOrders();
  </script>
</body>
</html>
