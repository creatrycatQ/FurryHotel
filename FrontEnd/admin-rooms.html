      <div class="nav-group">

  <main class="main-content" id="mainContent">
    <section class="tab-content" id="tab-rooms">
      <div class="tab-header">
        <h1 class="page-title">🏨 客房房间管理</h1>
        <button class="btn btn-primary" onclick="showRoomModal()">+ 添加房间</button>
      </div>
      <div class="room-grid" id="roomGrid"></div>
    </section>
  </main>

  <div class="modal-overlay hidden" id="roomModalOverlay">
    <div class="modal-box">
      <h3 id="roomModalTitle">添加客房房间</h3>
      <div class="form-group"><label>房间号/房号</label><input id="rmNumber" placeholder="如 101" /></div>
      <div style="display:flex;gap:12px">
        <div class="form-group" style="flex:1"><label>房型</label><select id="rmType"><option value="">加载中...</option></select></div>
        <div class="form-group" style="flex:1"><label>楼层</label><input type="number" id="rmFloor" value="1" /></div>
      </div>
      <div style="display:flex;gap:12px">
        <div class="form-group" style="flex:1"><label>价格 (元/间)</label><input type="number" id="rmPrice" value="388" /></div>
        <div class="form-group" style="flex:1"><label>状态</label><select id="rmStatus"><option value="available">空闲可用</option><option value="occupied">已入住</option><option value="reserved">已预订</option></select></div>
      </div>
      <div class="form-group"><label>描述</label><input id="rmDesc" placeholder="房间描述" /></div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="Admin.saveRoom()">保存</button>
        <button class="btn btn-outline" onclick="Admin.closeModal('roomModalOverlay')">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="transferRoomModalOverlay">
    <div class="modal-box">
      <h3>迁移住客房间</h3>
      <input type="hidden" id="tfOrderId" />
      <div class="form-group"><label>住客姓名</label><span id="tfGuestName" class="form-value" style="font-weight:bold;color:var(--text)"></span></div>
      <div class="form-group"><label>当前房号</label><span id="tfCurrentRoom" class="form-value" style="font-weight:bold;color:var(--text-secondary)"></span></div>
      <div class="form-group">
        <label>目标物理房间 (仅列出有空闲容量 of 客房)</label>
        <select id="tfTargetRoom" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px">
          <option value="">加载中...</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="Admin.confirmTransferRoom()">确认迁移</button>
        <button class="btn btn-outline" onclick="Admin.closeModal('transferRoomModalOverlay')">取消</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
