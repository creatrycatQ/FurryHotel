      <button class="btn-logout" id="logoutBtn">退出</button>

  <main class="main-content" id="mainContent">
    <section class="tab-content" id="tab-inviteCodes">
      <div class="tab-header">
        <h1 class="page-title">🎟️ 邀请码管理</h1>
        <button class="btn btn-primary" onclick="Admin.showGenerateInviteModal()">+ 生成邀请码</button>
      </div>
      <table class="data-table">
        <thead><tr><th>ID</th><th>邀请码</th><th>已用/上限</th><th>状态</th><th>过期时间</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody id="inviteCodeTableBody"></tbody>
      </table>
    </section>
  </main>

  <!-- 生成邀请码弹窗 -->
  <div class="modal-overlay hidden" id="generateInviteModalOverlay">
    <div class="modal-box">
      <h3>生成邀请码</h3>
      <div class="form-group"><label>生成数量</label><input type="number" id="inviteCount" value="1" min="1" max="50" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px" /></div>
      <div class="form-group"><label>每码使用次数上限</label><input type="number" id="inviteMaxUses" value="1" min="1" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px" /></div>
      <div class="form-group"><label>有效期（小时，留空则永不过期）</label><input type="number" id="inviteExpiresHours" placeholder="如 72 表示3天" min="1" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px" /></div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="Admin.generateInviteCodes()">生成</button>
        <button class="btn btn-outline" onclick="Admin.closeModal('generateInviteModalOverlay')">取消</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
