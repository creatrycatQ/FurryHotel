  <main class="main-content" id="mainContent">
    <section class="tab-content" id="tab-hotelRoomTypes">
      <div class="tab-header">
        <h1 class="page-title">🏨 客房房型管理</h1>
        <button class="btn btn-primary" onclick="showHotelRoomTypeModal()">+ 添加房型</button>
      </div>
      <table class="data-table">
        <thead><tr><th>房型名称</th><th>房房价格</th><th>房间容量</th><th>描述</th><th>操作</th></tr></thead>
        <tbody id="hotelRoomTypeTableBody"></tbody>
      </table>
    </section>
  </main>

  <div class="modal-overlay hidden" id="hotelRoomTypeModalOverlay">
    <div class="modal-box">
      <h3 id="hotelRoomTypeModalTitle">添加客房房型</h3>
      <div class="form-group"><label>房型标识 (英文唯一, 如 room_standard)</label><input id="hrtName" placeholder="如 room_standard" /></div>
      <div class="form-group"><label>房型名称 (如 标准大床房)</label><input id="hrtLabel" placeholder="如 标准大床房" /></div>
      <div style="display:flex;gap:12px">
        <div class="form-group" style="flex:1"><label>默认价格 (元)</label><input type="number" id="hrtBasePrice" value="388" /></div>
        <div class="form-group" style="flex:1"><label>默认押金 (元)</label><input type="number" id="hrtDeposit" value="100" /></div>
      </div>
      <div class="form-group"><label>房间容量 (最大同住人数)</label><input type="number" id="hrtCapacity" value="2" min="1" max="10" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px" /></div>
      <div class="form-group"><label>描述</label><input id="hrtDesc" placeholder="房型描述" /></div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="Admin.saveHotelRoomType()">保存</button>
        <button class="btn btn-outline" onclick="Admin.closeModal('hotelRoomTypeModalOverlay')">取消</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
