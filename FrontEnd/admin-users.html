    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" data-tab="dashboard" href="admin.html">
        <span class="nav-icon">📊</span><span class="nav-text">仪表盘</span>
      </a>
      <div class="nav-group">
        <a class="nav-item nav-parent" href="javascript:;">
          <span class="nav-icon">🎫</span><span class="nav-text">票务管理</span>
          <span class="nav-arrow">▸</span>
        </a>
        <div class="nav-submenu">
          <a class="nav-sub-item" data-tab="roomTypes" href="admin-room-types.html">票务套餐</a>
        </div>
      </div>
      <div class="nav-group">
        <a class="nav-item nav-parent" href="javascript:;">
          <span class="nav-icon">🏨</span><span class="nav-text">酒店管理</span>
          <span class="nav-arrow">▸</span>
        </a>
        <div class="nav-submenu">
          <a class="nav-sub-item" data-tab="hotelRoomTypes" href="admin-hotel-room-types.html">客房房型</a>
          <a class="nav-sub-item" data-tab="rooms" href="admin-rooms.html">客房房间</a>
        </div>
      </div>
      <div class="nav-group">
        <a class="nav-item nav-parent" href="javascript:;">
          <span class="nav-icon">📇</span><span class="nav-text">客人信息</span>
          <span class="nav-arrow">▸</span>
        </a>
        <div class="nav-submenu">
          <a class="nav-sub-item" data-tab="guestDetails" href="admin-guest-details.html">客人详情</a>
        </div>
      </div>
      <div class="nav-group">
        <a class="nav-item nav-parent" href="javascript:;">
          <span class="nav-icon">👥</span><span class="nav-text">实名管理</span>
          <span class="nav-arrow">▸</span>
        </a>
        <div class="nav-submenu">
          <a class="nav-sub-item" data-tab="guests" href="admin-guests.html">实名信息</a>
        </div>
      </div>
      <div class="nav-group">
        <a class="nav-item nav-parent" href="javascript:;">
          <span class="nav-icon">📋</span><span class="nav-text">订单管理</span>
          <span class="nav-arrow">▸</span>
        </a>
        <div class="nav-submenu">
          <a class="nav-sub-item" data-tab="orders" href="admin-orders.html">订单列表</a>
        </div>
      </div>
      <div class="nav-group">
        <a class="nav-item nav-parent" href="javascript:;">
          <span class="nav-icon">💰</span><span class="nav-text">押金管理</span>
          <span class="nav-arrow">▸</span>
        </a>
        <div class="nav-submenu">
          <a class="nav-sub-item" data-tab="deposit" href="admin-deposit.html">用户押金</a>
        </div>
      </div>

      <a class="nav-item" data-tab="verify" href="admin-verify.html">
        <span class="nav-icon">✅</span><span class="nav-text">在线核验</span>
      </a>
      <a class="nav-item" data-tab="users" href="admin-users.html">
        <span class="nav-icon">👤</span><span class="nav-text">账号管理</span>
      </a>
      <a class="nav-item" data-tab="inviteCodes" href="admin-invite-codes.html">
        <span class="nav-icon">🎟️</span><span class="nav-text">邀请码</span>
      </a>
      <a class="nav-item" data-tab="settings" href="admin-settings.html">
        <span class="nav-icon">⚙️</span><span class="nav-text">系统设置</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <span id="sidebarUser">管理员</span>
      <button class="btn-logout" id="logoutBtn">退出</button>
    </div>
  </aside>

  <main class="main-content" id="mainContent">
    <section class="tab-content" id="tab-users">
      <div class="tab-header">
        <h1 class="page-title">👤 账号管理</h1>
        <button class="btn btn-primary" onclick="showAddUserModal()">+ 添加账号</button>
      </div>
      <div id="pendingUsersBar" class="pending-users-bar" style="display:none;margin-bottom:16px;padding:12px 16px;background:#fff3cd;border:1px solid #ffc107;border-radius:8px;display:flex;align-items:center;gap:12px">
        <span>⏳ 有 <strong id="pendingUsersCount">0</strong> 个用户等待审核</span>
        <button class="btn btn-sm btn-primary" onclick="Admin.showPendingUsers()">查看并审核</button>
      </div>
      <table class="data-table">
        <thead><tr><th>ID</th><th>用户名</th><th>昵称</th><th>手机</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </section>
  </main>

  <!-- 修改密码弹窗 -->
  <div class="modal-overlay hidden" id="passwordModalOverlay">
    <div class="modal-box">
      <h3>修改密码</h3>
      <input type="hidden" id="pwUserId" />
      <p style="margin-bottom:12px;color:var(--text-secondary)">用户: <strong id="pwUsername"></strong></p>
      <div class="form-group"><label>新密码</label><input type="password" id="pwNew" placeholder="至少6位" /></div>
      <div class="form-group"><label>确认密码</label><input type="password" id="pwConfirm" placeholder="再次输入" /></div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="Admin.changePassword()">确认修改</button>
        <button class="btn btn-outline" onclick="Admin.closeModal('passwordModalOverlay')">取消</button>
      </div>
    </div>
  </div>

  <!-- 添加账号弹窗 -->
  <div class="modal-overlay hidden" id="addUserModalOverlay">
    <div class="modal-box">
      <h3>添加账号</h3>
      <div class="form-group"><label>用户名</label><input id="auUsername" placeholder="3-20位字母数字下划线" /></div>
      <div class="form-group"><label>密码</label><input type="password" id="auPassword" placeholder="至少6位" /></div>
      <div class="form-group"><label>昵称</label><input id="auNickname" placeholder="显示名称" /></div>
      <div style="display:flex;gap:12px">
        <div class="form-group" style="flex:1"><label>手机号</label><input id="auPhone" placeholder="选填" /></div>
        <div class="form-group" style="flex:1"><label>角色</label><select id="auRole"><option value="guest">普通用户</option><option value="admin">管理员</option></select></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="Admin.createUser()">创建</button>
        <button class="btn btn-outline" onclick="Admin.closeModal('addUserModalOverlay')">取消</button>
      </div>
    </div>
  </div>

  <!-- 待审核用户弹窗 -->
  <div class="modal-overlay hidden" id="pendingUsersModalOverlay">
    <div class="modal-box" style="max-width:600px">
      <h3>待审核用户</h3>
      <div id="pendingUsersList" style="max-height:400px;overflow-y:auto"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="Admin.closeModal('pendingUsersModalOverlay')">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
