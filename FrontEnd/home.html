<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>FurryEvent - 首页</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- Logo -->
  <div class="logo-area" style="padding-top:32px;">
    <span class="logo-icon">🐾</span>
    <h1 class="logo-title">FurryEvent</h1>
    <p class="logo-sub">大型狂欢沙龙活动，欢迎购票参加</p>
  </div>

  <!-- 用户卡片 -->
  <div class="dashboard">
    <div class="user-card">
      <div class="avatar">🐱</div>
      <div class="nickname" id="nickname">--</div>
      <div class="username" id="usernameDisplay">@--</div>
      <div class="info-row" id="phoneRow" style="display:none;">
        <span>📱</span><span id="phoneDisplay">--</span>
      </div>
      <div class="info-row">
        <span>🕐</span><span id="createdAt">--</span>
      </div>
    </div>

    <!-- 功能入口 -->
    <div class="menu-grid">
      <a class="menu-item" href="rooms.html">
        <span class="menu-icon">🎫</span>
        <span class="menu-label">余票查询</span>
      </a>
      <a class="menu-item" href="tickets.html" id="menuReserve">
        <span class="menu-icon">🎟️</span>
        <span class="menu-label">购买门票</span>
      </a>
      <a class="menu-item" href="id-verify.html">
        <span class="menu-icon">📇</span>
        <span class="menu-label">实名信息</span>
      </a>
      <a class="menu-item" href="orders.html">
        <span class="menu-icon">📋</span>
        <span class="menu-label">我的门票</span>
      </a>
      <a class="menu-item" href="verify.html">
        <span class="menu-icon">✅</span>
        <span class="menu-label">电子门票</span>
      </a>
      <a class="menu-item" href="javascript:;">
        <span class="menu-icon">💬</span>
        <span class="menu-label">在线客服</span>
      </a>
    </div>

    <!-- STAFF 专属功能板块 (仅 STAFF / 管理员可见) -->
    <div class="staff-section" id="staffSection" style="display:none;">
      <div class="staff-card-header">
        <span class="staff-badge">⚡ STAFF 工作人员专区</span>
      </div>
      <div class="staff-menu-list">
        <a class="staff-menu-card" href="staff-deposit.html">
          <div class="staff-menu-icon">💰</div>
          <div class="staff-menu-text">
            <div class="staff-menu-title">STAFF 押金管理</div>
            <div class="staff-menu-desc">查询及申请退还工作人员押金</div>
          </div>
          <span class="staff-menu-arrow">›</span>
        </a>
      </div>
    </div>

    <!-- 退出按钮 -->
    <button class="btn btn-danger" id="logoutBtn" style="margin-top:24px;">
      退出登录
    </button>
  </div>

  <!-- 底部 -->
  <p class="copyright-text" style="font-size:12px;color:#a8a29e;margin-bottom:20px;">&copy; 2026 FurryEvent</p>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // ---- 加载网站信息 ----
    App.loadSiteInfo();

    // ---- 未登录则跳转 ----
    if (!App.requireAuth()) {
      // requireAuth 内部会跳转
    }

    // ---- 加载用户信息 ----
    async function loadUserInfo() {
      const localUser = App.getUser();
      if (localUser) {
        displayUser(localUser);
      }

      // 从服务器刷新用户信息
      try {
        const res = await api.getMe();
        if (res.code === 200) {
          displayUser(res.data);
          localStorage.setItem('user', JSON.stringify(res.data));
        }
      } catch (err) {
        console.error('获取用户信息失败', err);
      }
    }

    function displayUser(user) {
      document.getElementById('nickname').textContent = user.nickname || user.username;
      document.getElementById('usernameDisplay').textContent = '@' + user.username;

      if (user.phone) {
        document.getElementById('phoneRow').style.display = 'flex';
        document.getElementById('phoneDisplay').textContent = user.phone;
      }

      if (user.created_at) {
        document.getElementById('createdAt').textContent =
          '注册于 ' + user.created_at;
      }

      // 控制 STAFF 专属板块显示：仅当用户角色为 STAFF (或管理员) 时显示
      const staffSection = document.getElementById('staffSection');
      if (staffSection) {
        if (user.role === 'staff' || user.role === 'admin') {
          staffSection.style.display = 'block';
        } else {
          staffSection.style.display = 'none';
        }
      }
    }

    // ---- 退出 ----
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
      App.logout();
    });

    // ---- 检查购票状态 ----
    async function checkBookingStatus() {
      try {
        const res = await fetch('/api/settings/booking-status');
        const json = await res.json();
        if (json.code === 200 && json.data) {
          const btn = document.getElementById('menuReserve');
          if (!json.data.open) {
            btn.href = 'javascript:;';
            btn.style.opacity = '0.7';
            btn.innerHTML = `
              <span class="menu-icon" style="filter: grayscale(1);">🔒</span>
              <span class="menu-label" style="color: var(--text-secondary);">购买门票 (暂未开放)</span>
            `;
            btn.addEventListener('click', function (e) {
              e.preventDefault();
              App.toast('购票通道暂未开放，请等待管理员开启。', 'info');
            });
          }
        }
      } catch (e) {
        console.error('获取购票状态失败', e);
      }
    }

    // ---- 初始化 ----
    loadUserInfo();
    checkBookingStatus();
  </script>
</body>

</html>
