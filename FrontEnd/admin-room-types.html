    <div class="sidebar-header">
      <span class="sidebar-logo">🐾</span>
      <span class="sidebar-title">售票后台</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" data-tab="dashboard" href="admin.html">
        <span class="nav-icon">📊</span><span class="nav-text">仪表盘</span>
      </a>
      <div class="nav-group">
        <a class="nav-item nav-parent" href="javascript:;">
          <span class="nav-icon">🎫</span><span class="nav-text">票务管理</span>
          <span class="nav-arrow">▸</span>
        </a>
        <div class="nav-submenu">
          <a class="nav-sub-item" data-tab="roomTypes" href="admin-room-types.html">票务套餐</a>
        </div>
      </div>
      <div class="nav-group">
        <a class="nav-item nav-parent" href="javascript:;">
          <span class="nav-icon">🏨</span><span class="nav-text">酒店管理</span>
          <span class="nav-arrow">▸</span>
        </a>
        <div class="nav-submenu">
          <a class="nav-sub-item" data-tab="hotelRoomTypes" href="admin-hotel-room-types.html">客房房型</a>
          <a class="nav-sub-item" data-tab="rooms" href="admin-rooms.html">客房房间</a>
        </div>
      </div>
      <div class="nav-group">
        <a class="nav-item nav-parent" href="javascript:;">
          <span class="nav-icon">📇</span><span class="nav-text">客人信息</span>
          <span class="nav-arrow">▸</span>
        </a>
        <div class="nav-submenu">
          <a class="nav-sub-item" data-tab="guestDetails" href="admin-guest-details.html">客人详情</a>
        </div>
      </div>
      <div class="nav-group">
        <a class="nav-item nav-parent" href="javascript:;">
          <span class="nav-icon">👥</span><span class="nav-text">实名管理</span>
          <span class="nav-arrow">▸</span>
        </a>
        <div class="nav-submenu">
          <a class="nav-sub-item" data-tab="guests" href="admin-guests.html">实名信息</a>
        </div>
      </div>
      <div class="nav-group">
        <a class="nav-item nav-parent" href="javascript:;">
          <span class="nav-icon">📋</span><span class="nav-text">订单管理</span>
          <span class="nav-arrow">▸</span>
        </a>
        <div class="nav-submenu">
          <a class="nav-sub-item" data-tab="orders" href="admin-orders.html">订单列表</a>
        </div>
      </div>
      <div class="nav-group">
        <a class="nav-item nav-parent" href="javascript:;">
          <span class="nav-icon">💰</span><span class="nav-text">押金管理</span>
          <span class="nav-arrow">▸</span>
        </a>
        <div class="nav-submenu">
          <a class="nav-sub-item" data-tab="deposit" href="admin-deposit.html">用户押金</a>
        </div>
      </div>

      <a class="nav-item" data-tab="verify" href="admin-verify.html">
        <span class="nav-icon">✅</span><span class="nav-text">在线核验</span>
      </a>
      <a class="nav-item" data-tab="users" href="admin-users.html">
        <span class="nav-icon">👤</span><span class="nav-text">账号管理</span>
      </a>
      <a class="nav-item" data-tab="inviteCodes" href="admin-invite-codes.html">
        <span class="nav-icon">🎟️</span><span class="nav-text">邀请码</span>
      </a>
      <a class="nav-item" data-tab="settings" href="admin-settings.html">
        <span class="nav-icon">⚙️</span><span class="nav-text">系统设置</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <span id="sidebarUser">管理员</span>
      <button class="btn-logout" id="logoutBtn">退出</button>
    </div>
  </aside>

  <main class="main-content" id="mainContent">
    <section class="tab-content" id="tab-roomTypes">
      <div class="tab-header">
        <h1 class="page-title">🎫 票务套餐/票档</h1>
        <button class="btn btn-primary" onclick="showRoomTypeModal()">+ 添加套票</button>
      </div>
      <table class="data-table">
        <thead><tr><th>套餐名称</th><th>是否含住宿</th><th>价格</th><th>描述</th><th>操作</th></tr></thead>
        <tbody id="roomTypeTableBody"></tbody>
      </table>
    </section>
  </main>

  <div class="modal-overlay hidden" id="roomTypeModalOverlay">
    <div class="modal-box">
      <h3 id="roomTypeModalTitle">添加票务套餐</h3>
      <div class="form-group"><label>套票名称</label><input id="rtLabel" placeholder="如 单日门票+标准大床房" /></div>
      <div class="form-group"><label>套餐价格 (元)</label><input type="number" id="rtBasePrice" value="0" /></div>
      
      <div class="form-group" style="margin: 12px 0;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:normal;">
          <input type="checkbox" id="rtIsRoomPackage" onchange="Admin.toggleRoomPackageEdit(this.checked)" style="width:auto;margin:0;" />
          <span>包含客房住宿</span>
        </label>
      </div>
      
      <div class="form-group id-room-package-only hidden" id="rtRoomTypeGroup">
        <label>关联酒店房型</label>
        <select id="rtHotelRoomType" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px">
          <option value="">加载中...</option>
        </select>
      </div>

      <div class="form-group id-ticket-only-only" id="rtStockGroup">
        <label>门票上限 / 总库存 (张)</label>
        <input type="number" id="rtStock" value="100" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px" />
      </div>

      <div class="form-group" style="display:none"><label>默认押金 (元)</label><input type="number" id="rtDeposit" value="0" /></div>
      <div class="form-group"><label>描述</label><input id="rtDesc" placeholder="套票描述" /></div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="Admin.saveRoomType()">保存</button>
        <button class="btn btn-outline" onclick="Admin.closeModal('roomTypeModalOverlay')">取消</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
