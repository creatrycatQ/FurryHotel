<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f59e0b" />
  <title>FurryHotel - 订单记录</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .order-list { width: 100%; max-width: 400px; padding-bottom: 40px; }
    .order-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }
    .order-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .order-header .order-id { font-size: 14px; font-weight: 700; color: var(--text); }
    .order-status {
      font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 600;
    }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-approved { background: #d1fae5; color: #065f46; }
    .status-confirmed { background: #dbeafe; color: #1e40af; }
    .status-checked_in { background: #dbeafe; color: #1e40af; }
    .status-completed { background: #e0e7ff; color: #3730a3; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }
    .order-info { font-size: 13px; color: var(--text-secondary); line-height: 1.8; }
    .order-info span { color: var(--text); font-weight: 500; }
    .order-time { font-size: 12px; color: #a8a29e; margin-top: 8px; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 14px; color: var(--primary-dark); text-decoration: none; font-weight: 600; margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="logo-area" style="padding-top:24px;">
    <span class="logo-icon">📋</span>
    <h1 class="logo-title">订单记录</h1>
    <p class="logo-sub">查看您的预定历史</p>
  </div>

  <div class="order-list">
    <a class="back-link" href="home.html">← 返回首页</a>
    <div id="orderContainer">
      <div class="empty-state">
        <div class="icon">⏳</div>
        <p>加载中...</p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!App.requireAuth()) {}

    async function loadOrders() {
      var container = document.getElementById('orderContainer');
      try {
        var res = await api.getUserOrders();
        if (res.code !== 200) {
          container.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>' + (res.message || '加载失败') + '</p></div>';
          return;
        }

        var orders = res.data;
        if (!orders || orders.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无订单</p></div>';
          return;
        }

        container.innerHTML = '';
        orders.forEach(function(order) {
          var card = document.createElement('div');
          card.className = 'order-card';

          var statusClass = 'status-' + order.status;
          var statusText = App.getStatusText(order.status);

          card.innerHTML = ''
            + '<div class="order-header">'
            +   '<span class="order-id">订单 #' + order.id + '</span>'
            +   '<span class="order-status ' + statusClass + '">' + statusText + '</span>'
            + '</div>'
            + '<div class="order-info">'
            +   '👤 入住人：<span>' + esc(order.guest_name) + '</span><br/>'
            +   '🏨 房间：<span>' + esc(order.room_number || '待分配') + ' ' + esc(order.room_type_label || order.room_type || '') + '</span><br/>'
            +   '💰 金额：<span>¥' + (order.total_price || 0) + '</span>'
            + '</div>'
            + (order.remark ? '<div class="order-time">📝 ' + esc(order.remark) + '</div>' : '')
            + '<div class="order-time">🕐 ' + esc(order.created_at || '') + '</div>';

          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>网络错误，请重试</p></div>';
        console.error(err);
      }
    }

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    loadOrders();
  </script>
</body>
</html>
