<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f59e0b" />
  <title>FurryEvent - 扫码签到验票</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/html5-qrcode.min.js"></script>
  <style>
    .scan-page { width: 100%; max-width: 400px; padding-bottom: 40px; }
    .scan-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }
    #scanner-container {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .manual-input {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .manual-input input {
      flex: 1;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: var(--font);
      background: #fafaf9;
    }
    .manual-input input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .manual-input button {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .manual-input button:active { background: var(--primary-dark); }
    .result-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      text-align: center;
      display: none;
    }
    .result-card.show { display: block; }
    .result-card .result-icon { font-size: 48px; margin-bottom: 12px; }
    .result-card .result-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .result-card .result-detail {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.8;
      text-align: left;
      margin-top: 12px;
      padding: 12px;
      background: #fefce8;
      border-radius: 8px;
    }
    .result-card .result-detail span { color: var(--text); font-weight: 500; }
    .result-success .result-title { color: #065f46; }
    .result-error .result-title { color: #991b1b; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .scan-tip {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="logo-area" style="padding-top:24px;">
    <span class="logo-icon">📷</span>
    <h1 class="logo-title">现场扫码验票</h1>
    <p class="logo-sub">扫描电子门票二维码完成现场入场核销</p>
  </div>

  <div class="scan-page">
    <a class="back-link" href="admin.html">← 返回后台</a>

    <div class="scan-card">
      <div id="scanner-container"></div>
      <p class="scan-tip">将摄像头对准用户手机上的电子票二维码</p>
    </div>

    <div class="scan-card">
      <p style="font-size:14px;font-weight:600;margin-bottom:10px;">核销设置</p>
      <div class="manual-input">
        <input type="number" id="globalDeposit" placeholder="押金金额（元，可选）" min="0" />
      </div>
    </div>

    <div class="scan-card">
      <p style="font-size:14px;font-weight:600;margin-bottom:10px;">手动输入门票订单号</p>
      <div class="manual-input">
        <input type="number" id="manualOrderId" placeholder="输入订单ID" />
        <button id="manualBtn" onclick="manualCheckin()">验票</button>
      </div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-detail" id="resultDetail"></div>
      <button class="btn" style="margin-top:16px;" onclick="resetScan()">继续扫码</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

    // Check admin auth
    if (!App.requireAdminAuth()) { /* redirect */ }

    let html5Scanner = null;

    // Initialize scanner
    function initScanner() {
      html5Scanner = new Html5Qrcode('scanner-container');
      html5Scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScanSuccess,
        () => {} // ignore scan errors
      ).catch(err => {
        document.getElementById('scanner-container').innerHTML =
          '<p style="padding:40px;text-align:center;color:var(--text-secondary);">📷 无法访问摄像头<br/><span style="font-size:12px;">请使用手动输入订单号方式</span></p>';
      });
    }

    async function onScanSuccess(decodedText) {
      // Pause scanner
      if (html5Scanner) {
        html5Scanner.pause(true);
      }

      let orderId = null;
      try {
        const data = JSON.parse(decodedText);
        if (data.type === 'furry_checkin' && data.order_id) {
          orderId = data.order_id;
        }
      } catch {
        // Maybe it's just a plain number
        const num = parseInt(decodedText, 10);
        if (!isNaN(num)) orderId = num;
      }

      if (!orderId) {
        showResult(false, '无效二维码', '无法识别该二维码内容，请确认是电子门票二维码');
        return;
      }

      await doCheckin(orderId);
    }

    async function manualCheckin() {
      const input = document.getElementById('manualOrderId');
      const orderId = parseInt(input.value, 10);
      if (!orderId || orderId <= 0) {
        App.toast('请输入有效订单号', 'error');
        return;
      }
      await doCheckin(orderId);
    }

    async function doCheckin(orderId) {
      try {
        const adminToken = localStorage.getItem('admin_token');
        if (!adminToken) {
          showResult(false, '未登录', '请先登录管理员账号');
          return;
        }

        const depositInput = document.getElementById('globalDeposit');
        const depositAmount = depositInput ? parseFloat(depositInput.value) || 0 : 0;

        const response = await fetch(location.origin + '/api/user/checkin', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + adminToken
          },
          body: JSON.stringify({ order_id: orderId, deposit_amount: depositAmount })
        });
        if (response.status === 401) {
          localStorage.removeItem('admin_token');
          localStorage.removeItem('admin_user');
          location.href = 'admin-login.html';
          return;
        }
        const res = await response.json();
        if (res.code === 200) {
          const d = res.data;
          showResult(true, '验票入场成功', `
            👤 持票人：<span>${esc(d.guest_name)}</span><br/>
            🎫 房间号：<span>${esc(d.room_number || '无')}</span><br/>
            🔢 订单号：<span>#${esc(d.order_id)}</span>
          `);
        } else {
          showResult(false, '验票失败', res.message || '未知错误');
        }
      } catch (err) {
        showResult(false, '网络错误', '请检查网络连接后重试');
        console.error(err);
      }
    }

    function showResult(success, title, detail) {
      const card = document.getElementById('resultCard');
      const icon = document.getElementById('resultIcon');
      const titleEl = document.getElementById('resultTitle');
      const detailEl = document.getElementById('resultDetail');

      card.className = `result-card show ${success ? 'result-success' : 'result-error'}`;
      icon.textContent = success ? '✅' : '❌';
      titleEl.textContent = title;
      detailEl.innerHTML = detail;
    }

    function resetScan() {
      document.getElementById('resultCard').className = 'result-card';
      if (html5Scanner) {
        try { html5Scanner.resume(); } catch {}
      }
    }

    // Start on page load
    if (localStorage.getItem('admin_token')) {
      initScanner();
    }
  </script>
</body>
</html>
